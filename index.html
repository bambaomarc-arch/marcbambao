<script>
const C=[
["Chapter 1","The Wreckage and the Shift","w",`The silence of the jungle was heavy, almost synthetic.

It wasn't the vibrant noise of nature; it was a muted, mechanical stillness. High above, the sky was a featureless vault of bruised violet daylight that never changed, never bled into sunset, and never showed a sun.

Marcus pressed his back against the rusted hull of an overturned city bus. Banyan trees and thick, unnatural vines had wrapped themselves around the chassis like strangler figs, pinning the wreckage into the earth. Fifty feet away, Maya sat on a shattered concrete barrier, methodically cleaning the lenses of a pair of cracked glasses she no longer needed—her vision had cured itself the moment she awoke in this place, an unsettling detail she tried hard to ignore.

"Any sign of a radio tower?" Maya called out, her voice barely carrying over the faint, subterranean hum that vibrated through the soil.

"Nothing," Marcus said, wiping sweat from his forehead. "Just more concrete, more roots, and about a hundred people who have no idea how we got here."

Three days ago, nearly a hundred strangers had woken up scattered across the ruined grid of a phantom metropolis swallowed by dense, ancient growth. No phones. No power lines. No horizon—just an oppressive canopy of bioluminescent trees and towering, moss-covered skyscrapers whose interiors were filled with solid stone.

"We need to consolidate the water supplies before dark," said Vance, a tall, burly former firefighter whose steady composure had naturally made him the group's leader. He stepped over a mound of overgrown rubble, pointing toward a clearing near an abandoned, vaulted subway entrance. "Gather everyone at the concourse. If there's a storm coming, we'll need cover."

By 8:45 PM, the group gathered beneath the crumbling concrete canopy of the transit station. Whispers of confusion and fear drifted through the crowd like smoke.

"It doesn't make sense," a young woman named Sarah muttered, clutching a faded leather jacket tight against her chest. "I was on the subway on my way to work in Chicago. I closed my eyes for two minutes..."

"Me too," Marcus replied gently. "Third Avenue line. One minute I was holding a cold brew, the next I was lying in a patch of ferns."

At 8:59 PM, the subtle background hum of the forest went dead silent.

A strange, mechanical chime—like the resonant, iron reverberation of a massive factory shift whistle—echoed from deep beneath the earth.

"What was that?" Vance demanded, standing up and reaching for a heavy iron pipe.

**9:00 PM.**

The earth beneath the asphalt buckled with a violent shudder. From five distinct, glowing fissures around the perimeter of the clearing, dark, fluid-like figures dragged themselves up into the pale light. Their faces were featureless, hollowed-out husks, and as they expanded, their limbs snapped into place with sickening metallic clicks. They moved with terrifying, unnatural speed, uttering a rhythmic, guttural screech.

"Run!" someone screamed.

Chaos erupted. The horde hit the crowd like a tidal wave. Screams filled the night as survivors scrambled over debris, reaching blindly in the dark. Marcus grabbed Maya by the jacket, shoving her up the steps of the station as a creature lunged for her ankle, its pitch-black fingers turning to liquid iron before hardening into claws. Vance stood his ground near the foot of the stairs, swinging the heavy iron pipe with desperate, furious strength to buy them time.

The violence was continuous, loud, and relentless. The survivors fought with rocks, broken pipes, and sheer instinct, driven into corners and torn apart in the dark as the hours stretched endlessly.

Then, as suddenly as it had begun, a resonant chime cut through the air.

**5:00 AM.**

The creatures froze mid-stride. Their fluid forms rigidified and dissolved into fine grey ash, scattered instantly by a sudden, unnatural breeze.

Silence returned. The faint violet light crept through the canopy once more, illuminating a blood-soaked encampment.

Marcus collapsed against a concrete pillar, his chest heaving, his hands shaking violently. Maya slumped beside him, her face pale. Vance walked slowly through the wreckage, counting heads. His face was grim.

"How many?" Maya asked, her voice cracking.

"Sixty," Vance whispered, staring down at his bloodied hands. "There are only sixty of us left."`],
["Chapter 2","The Routine of Survival","r",`Three weeks passed. The jungle did not change, but the survivors did.

The initial terror subsided into something far more dangerous: a cold, mechanical routine. They had learned the precise architecture of the realm. Every night at 9:00 PM, the chime echoed, and the creatures spawned at five precise locations: the subway grid, the cracked fountain, the collapsed overpass, the bank lobby, and the sunken parking garage. Every morning at 5:00 AM, the whistle blew, and the horde dissolved.

The remaining group had dwindled down to twenty-five. But those twenty-five were no longer panicked strangers. They were an efficient, lethal unit.

"Spawn point three is clear!" Sarah shouted across the courtyard, lowering a reinforced wooden spear tipped with sharpened rebar. Her leather jacket was scuffed and tied at the waist, her movements precise, calculated, and effortless.

"Focus on the flank at the overpass!" Vance called out from a high concrete ledge. He dropped a heavy cinder block onto an advancing creature below, crushing its hollow core instantly. "Maya, Marcus, hold the line at the bank entrance!"

"On it!" Marcus yelled. He parried a strike from a hollow-faced assailant with a makeshift steel shield cut from a car door, driving a spike through its chest. Beside him, Maya swung an iron rod with practiced precision, stepping in cadence with Marcus's movements like clockwork.

They didn't speak unnecessarily. They didn't panic. They fought like gear teeth in a clockwork machine.

**5:00 AM.**

The whistle chimed. The remaining creatures dissolved into harmless ash.

Marcus lowered his shield and let out a long breath. He turned to Maya and offered a small, weary smile. "Good shift."

"Good shift," Maya replied automatically, handing him a canteen.

The twenty-five survivors gathered at the center camp. There were no tears today, no panic. They Band-Aided cuts, stacked weapons in designated racks, swept ash from the perimeter, and logged their inventory on scrap metal using sharp stones.

"Zero casualties again," Vance announced during the morning briefing, his voice stern yet proud. "That's five nights in a row. We've mapped their paths. We know every spawn point. As long as everyone sticks to their station, nobody dies."

Sarah sat on a crate, sharpening her spear with a flat river stone. "It's almost easy now. 9 to 5. Show up, do the work, go to sleep."

Marcus looked around at the hardened faces of the group. Vance, Sarah, Maya, and twenty others. They had become family, forged in the fires of an endless night.

"We're going to make it out of here," Marcus said quietly, sitting beside Maya. "We just have to keep the system tight."

"Yeah," Maya whispered, staring down at her worn boots. "We just have to keep working."`],
["Chapter 3","The Petrification Paradox","s",`That night, the 9-to-5 shift went flawlessly. Not a single survivor suffered so much as a scratch. By 11:30 PM, the horde at the main gate had been systematically repelled, and the group took their rotated ten-minute rest breaks.

At 11:58 PM, Marcus was sitting near the central fire pit, checking the leather binding on his spear. Across from him sat David, a quiet engineer who had kept the group's rain-catchment filtration system running.

"David, you good for the 1:00 AM watch?" Marcus asked.

David didn't answer. He was staring down at his right hand.

"David?"

Maya walked over, holding two tin cups of boiled water. "What's wrong?"

"I... I can't feel my fingers," David murmured.

Marcus leaned in. Under the firelight, David's forearm had turned a dull, matte grey. Marcus reached out to touch it. It wasn't cold or clammy—it was cold, hard, unyielding granite.

"Vance!" Maya yelled, her voice breaking the night's calm. "Get over here now!"

By midnight, the grey coloration had crept up David's shoulder. Beside him, Sarah gasped as she collapsed to her knees—her left leg had turned solid stone from the hip down, pinning her to the ground with a dull, heavy thud.

"What is this?!" Sarah screamed, hammering her fists against her petrified leg. It produced a hollow *clack-clack* sound. "Vance! What's happening to me?!"

"Hold still!" Vance shouted, drawing a knife, but there was no wound, no venom to drain.

Within thirty minutes, four more group members began turning to stone. The petrification crept steadily, inch by inch, spreading across their skin like a slow frost. By 12:45 AM, eight people were fully transformed into lifeless, grey statues, frozen in expressions of silent panic. Two more were halfway gone.

Among them was David. He sat completely immobile, a statue staring blankly into the fire.

"The creatures aren't even near us!" Sarah sobbed, her torso turning grey. Her throat was stiffening, making her voice scratchy and faint. "We did everything right... we stopped them..."

A young survivor named Leo looked down at his boots. The grey stone was creeping up his shins. He looked at the eight statues of his friends, then at Vance, then at Marcus.

"I can't... I can't be a stone," Leo whimpered, tears cutting clean tracks down his dust-covered face. "I can't be trapped inside my own head..."

"Leo, wait—" Marcus started, taking a step forward.

Before anyone could reach him, Leo drew his side-knife and drove it deep into his own chest.

He collapsed to the dirt.

A sharp, violent shockwave of warm air burst from Leo's body, rippling across the clearing. Instantly, the sound of cracking stone echoed through the camp like snapping timber.

*CRACK.*

David gasped, drawing a deep, ragged breath as skin and blood rushed back into his arm. Sarah fell forward, her legs turning back to soft flesh as she tumbled onto the earth, weeping hysterically. Every single petrified survivor fell to the ground, fully restored, gasping for air as if breaking through the surface of deep water.

Marcus stood frozen, looking from Leo's lifeless body on the ground to the living, breathing comrades who had been stone seconds ago.

The silence that followed was suffocating.`],
["Chapter 4","The Fall of Trust","t",`The realization was a poison that seeped into the camp by sunrise.

"It demands a trade," Vance said, his voice flat and cold as he stood over the dying fire the next afternoon. "The system doesn't care if we defeat the creatures. The realm requires a quota. A blood tax. If nobody dies in combat, it takes us through the stone."

"One life," Maya said softly, her eyes hollow. "Leo's death saved ten people."

"So what are you saying?" Sarah demanded, her voice sharp and wild. She backed away from the circle, her hand resting on the hilt of her blade. "We choose someone to die every night? Who gets to pick?"

"Nobody picks!" Marcus snapped, stepping between them. "We find another way! We break the spawn gates, we tear down the walls—"

"We've tried everything for a month, Marcus!" Vance cut him off, his eyes dark with desperate intensity. "You saw what happened. If we don't bleed, we turn to rock. Do you want to spend eternity as a statue in this damn jungle?"

"So you're proposing murder?" Maya asked, glaring at Vance.

"I'm proposing survival!" Vance roared.

The trust that had taken weeks of shared blood and sweat to build disintegrated in hours.

That night, when the 9:00 PM whistle blew, the defense collapsed entirely. No one watched each other's backs. Everyone fought defensively, looking over their shoulders not at the creatures, but at their fellow survivors.

"Vance! Behind you!" David called out during the height of the fight.

Vance turned, saw a creature leaping toward David—and deliberately stepped back, letting it happen.

"Vance! Help me!" David screamed as he was dragged down into the shadows.

Vance didn't move. "That's one," he muttered under his breath.

"You monster!" Sarah shrieked, turning her spear toward Vance instead of the horde.

By midnight, the camp was a warzone of paranoia. Friends fought friends in the shadows of the ruins, desperate to ensure that someone—anyone else—was sacrificed before the petrification could take hold. Screams of betrayal rang louder than the screeches of the monsters.

By the fourth night after the paradox began, the group had decimated itself. Where twenty-five battle-tested comrades once stood, only ten remained.`],
["Chapter 5","Choosing Humanity","h",`The rain fell in sheets, washing ash and mud across the ruined plaza.

The ten remaining survivors stood in a circle around the dying coals of the central fire. Marcus, Maya, Vance, Sarah, and six others. Their clothes were tattered, their faces bruised, their eyes completely drained of light.

Vance held a bloody hatchet, his hands trembling violently. "It's almost midnight," he rasped, his voice breaking. "Someone... someone has to..."

He looked at Sarah. He looked at Maya. But as he met Maya's eyes, something in Vance seemed to shatter. The weight of every calculated sacrifice, every cold decision, collapsed on his chest. He dropped the hatchet into the mud with a dull thud.

"I can't," Vance whispered, sinking to his knees in the sludge. "I killed Miller yesterday. I watched David die. I'm... I don't even know who I am anymore."

"None of us do," Sarah said softly, letting her spear slip from her fingers. She looked down at her hands, stained grey with dried dirt and old blood. "We survived the monsters just to become them."

Maya walked over to Vance and held out her hand, helping the large man to his feet. She looked around at the ten broken souls left in the rain.

"We thought staying alive was the point," Maya said, her voice remarkably clear over the sound of the storm. "But this place isn't trying to kill our bodies. It's trying to make us give up our humanity. Every time we sacrifice one of us to save ourselves, we're already turning to stone."

Marcus stepped beside Maya, taking her hand. "No more sacrifices," he said quiet and firm. "No more trading lives. If we die tonight, we die as human beings."

One by one, the others stepped forward.

Sarah took Marcus's free hand. Vance took Maya's. The remaining six joined hands, forming an unbreakable ring in the center of the flooded plaza.

**12:00 AM.**

A cold thrill swept through Marcus's veins. He felt the heavy, rigid weight creep up his ankles, locking his joints in place. He looked to his left; grey stone was already spreading across Sarah's neck.

She wasn't screaming. She was smiling, tears brimming in her eyes. "Thank you," she whispered.

"Hold tight," Marcus said, squeezing Maya's hand with all the strength he had left.

"I'm holding," Maya replied, leaning her head against his shoulder as the stone washed over her chest and face, locking her warm expression into eternal stillness.

Vance closed his eyes, taking a deep, final breath as the petrification encased his jaw.

Marcus felt the frost reach his eyes. He didn't fight it. He held Maya's hand tight, looked up at the canopy one last time, and let the darkness close in.`],
["Epilogue","The Awakening","c",`**BLARE!**

A deafening truck horn shrieked through the air.

Marcus gasped, his lungs inflating violently with cold, diesel-scented air.

He wasn't lying on wet moss or broken concrete. He was lying on cold asphalt. Bright white fluorescent streetlights blinded him, and the yellow glow of headlights washed over his face.

"Hey! Get out of the street! Are you crazy?!" a cab driver yelled, leaning out of his window, slamming his hand on the horn.

Marcus sat up abruptly. The jungle was gone. The ruined skyscrapers were replaced by the glittering glass towers of Michigan Avenue. Cars swerved around them, tires screeching on the rain-slick pavement.

Beside him, nine people scrambled up from the road.

Maya looked at her hands—soft, warm, flesh and blood. She looked at Marcus, then down at their clasped fingers. They were still holding hands.

"Marcus?" she breathed.

Sarah was sitting in the lane beside them, laughing hysterically, wiping real tears from her cheeks. Vance stood in the middle of the street, staring up at the traffic lights, his broad shoulders shaking with silent, overwhelmed sobs.

All ten of them gathered on the sidewalk as pedestrian crowds brushed past them, rushing home from late-night shifts, completely oblivious.

"We made it," Vance choked out, wiping his face with his sleeve. "We're back."

"How?" Sarah asked, looking around at the bustling city. "Why did it let us go?"

Marcus looked at Maya, then at Vance, and finally at the crowd of commuters marching past them with tired, distant eyes.

"Because we refused to play the game," Marcus said softly.

They stood together on the noisy city corner, ten strangers who had descended into the dark, faced the monster within, and chosen love over survival. They knew they could never tell a soul. No one would ever believe them.

Maya squeezed Marcus's hand one last time before letting go.

They didn't need to speak the secret aloud. They just looked at one another, smiled through their tears, and stepped forward into the real world together.

**The End**`]];
